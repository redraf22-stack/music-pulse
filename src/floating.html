<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Трансляция</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;}
.header{position:fixed;top:0;left:0;right:0;height:32px;background:rgba(0,0,0,.85);display:flex;align-items:center;padding:0 10px;z-index:10;-webkit-app-region:drag;}
.header-title{flex:1;color:#fff;font-size:12px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.header-btn{background:none;border:none;color:#fff;font-size:14px;cursor:pointer;padding:4px 8px;border-radius:4px;-webkit-app-region:no-drag;}
.header-btn:hover{background:rgba(255,255,255,.2);}
.header-btn.close:hover{background:#e74c3c;}
video{width:100vw;height:100vh;object-fit:contain;background:#000;}
.resize{position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#888 50%,#888 60%,transparent 60%,transparent 70%,#888 70%,#888 80%,transparent 80%);}
</style>
</head>
<body>
<div class="header">
<div class="header-title" id="title">📺 Трансляция</div>
<button class="header-btn" onclick="expandToMain()" title="Развернуть в приложение">⛶</button>
<button class="header-btn close" onclick="closeWindow()" title="Закрыть">✕</button>
</div>
<video id="video" autoplay playsinline></video>
<div class="resize" id="resize"></div>
<script src="js/helpers.js"></script>
<script>
const params=new URLSearchParams(window.location.search);
const type=params.get('type');
const peerId=params.get('peerId');
const userName=params.get('userName');
const isSelf=params.get('isSelf')==='true';

document.getElementById('title').textContent=(type==='video'?'📹':'📺')+' '+decodeURIComponent(userName);
const video=document.getElementById('video');
if(isSelf)video.muted=true;

// Получаем стрим через PeerJS
const peer=new Peer({host:window.location.hostname,port:3002,path:'/peerjs',secure:window.location.protocol==='https:',debug:0});
peer.on('open',()=>{
if(isSelf){
window.electronAPI.getMyStream().then(stream=>{if(stream)video.srcObject=stream;});
}else{
peer.call(peerId,new MediaStream()).then(call=>{
call.on('stream',stream=>{video.srcObject=stream;});
});
}
});

function closeWindow(){window.electronAPI.closeFloatingWindow();}
function expandToMain(){window.electronAPI.expandFloatingWindow();}

// Ресайз
const resize=document.getElementById('resize');
let isResizing=false,startX,startY,startW,startH;
resize.addEventListener('mousedown',e=>{isResizing=true;startX=e.clientX;startY=e.clientY;startW=window.outerWidth;startH=window.outerHeight;e.preventDefault();});
document.addEventListener('mousemove',e=>{if(!isResizing)return;window.resizeTo(startW+(e.clientX-startX),startH+(e.clientY-startY));});
document.addEventListener('mouseup',()=>{isResizing=false;});
</script>
</body>
</html>
