<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Трансляция</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;}
.header{position:fixed;top:0;left:0;right:0;height:34px;background:rgba(20,20,20,.92);display:flex;align-items:center;gap:2px;padding:0 6px;z-index:10;-webkit-app-region:drag;}
.header-title{flex:1;color:#eee;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:6px;}
.hbtn{background:none;border:none;color:#bbb;font-size:13px;cursor:pointer;padding:5px 9px;border-radius:5px;-webkit-app-region:no-drag;line-height:1;}
.hbtn:hover{background:rgba(255,255,255,.15);color:#fff;}
.hbtn.ret:hover{background:#1db954;color:#000;}
.hbtn.cls:hover{background:#e74c3c;color:#fff;}
video{position:absolute;top:34px;left:0;width:100%;height:calc(100% - 34px);object-fit:contain;background:#000;}
.resize{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;z-index:11;background:linear-gradient(135deg,transparent 50%,#777 50%,#777 62%,transparent 62%,transparent 72%,#777 72%,#777 84%,transparent 84%);}
.status{position:absolute;top:44px;left:50%;transform:translateX(-50%);color:#888;font-size:12px;z-index:5;}
</style>
</head>
<body>
<div class="header">
<div class="header-title" id="title">📺 …</div>
<button class="hbtn ret" id="btn-ret" title="Вернуть в приложение">⬅</button>
<button class="hbtn" id="btn-min" title="Свернуть">—</button>
<button class="hbtn" id="btn-max" title="На весь экран">⛶</button>
<button class="hbtn cls" id="btn-cls" title="Закрыть">✕</button>
</div>
<div class="status" id="status">Подключение…</div>
<video id="video" autoplay playsinline></video>
<div class="resize" id="resize"></div>
<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
const params=new URLSearchParams(location.search);
const type=params.get('type')||'screen';
const targetPeer=params.get('peerId')||'';
const userName=decodeURIComponent(params.get('userName')||'');
const isSelf=params.get('isSelf')==='true';
document.getElementById('title').textContent=(type==='video'?'📹 ':'📺 ')+userName+(isSelf?' (Вы)':'');
const video=document.getElementById('video');
if(isSelf)video.muted=true;
const winId=params.get('winId')||'';
document.getElementById('btn-cls').onclick=()=>window.electronAPI.closeFloatingWindow(winId);
document.getElementById('btn-min').onclick=()=>window.electronAPI.minimizeFloatingWindow(winId);
document.getElementById('btn-max').onclick=()=>window.electronAPI.toggleMaximizeFloatingWindow(winId);
document.getElementById('btn-ret').onclick=()=>window.electronAPI.returnFloatingToMain({winId:winId});
const peer=new Peer({host:location.hostname,port:3002,path:'/peerjs',secure:location.protocol==='https:',debug:0,config:{iceServers:[]}});
peer.on('open',async()=>{
if(isSelf){
try{
const stream=type==='video'?await navigator.mediaDevices.getUserMedia({video:true,audio:false}):await navigator.mediaDevices.getDisplayMedia({video:{cursor:'always'},audio:false});
video.srcObject=stream;
document.getElementById('status').style.display='none';
}catch(e){
document.getElementById('status').textContent='Ошибка: '+e.message;
document.getElementById('status').style.display='block';
}
}else{
const dummy=new MediaStream();
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const osc=ctx.createOscillator();osc.frequency.value=0;
const dst=ctx.createMediaStreamDestination();
osc.connect(dst);osc.start();
dummy.addTrack(dst.stream.getAudioTracks()[0]);
const call=peer.call(targetPeer,dummy,{metadata:{type:type==='video'?'video-req':'screen-req'}});
if(!call){document.getElementById('status').textContent='Не удалось подключиться';return;}
call.on('stream',s=>{video.srcObject=s;document.getElementById('status').style.display='none';});
call.on('close',()=>{document.getElementById('status').textContent='Трансляция завершена';document.getElementById('status').style.display='block';});
call.on('error',()=>{document.getElementById('status').textContent='Ошибка подключения';document.getElementById('status').style.display='block';});
}
});
peer.on('error',e=>{document.getElementById('status').textContent='Ошибка: '+e.type;document.getElementById('status').style.display='block';});
(function(){
const r=document.getElementById('resize');let on=false,sx,sy,sw,sh;
r.addEventListener('mousedown',e=>{on=true;sx=e.screenX;sy=e.screenY;sw=window.outerWidth;sh=window.outerHeight;e.preventDefault();});
window.addEventListener('mousemove',e=>{if(!on)return;window.resizeTo(Math.max(320,sw+e.screenX-sx),Math.max(240,sh+e.screenY-sy));});
window.addEventListener('mouseup',()=>{on=false;});
})();
</script>
</body>
</html>
